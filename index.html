<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Centro de Mando GSM24</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* Clase para ocultar el botón completamente */
        .hidden { display: none !important; }
        
        /* Botón de acceso final (se verá igual a tus otras tarjetas o botones según tu estilo) */
        .btn-final-mision { 
            display: block; 
            width: 100%; 
            padding: 20px; 
            margin-top: 20px; 
            background: var(--neon-green); 
            color: #000; 
            font-weight: bold; 
            text-align: center; 
            text-decoration: none; 
            border-radius: 12px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="container">
        <header style="text-align: center; margin-bottom: 30px;">
            <h1>CENTRO DE MANDO GSM24</h1>
            <p>Escuela de Formación Carlos Quiroga</p>
        </header>

        <div class="grid-single">
            <div class="mission-card" id="card-m1" onclick="location.href='m1.html'"><h3>MISIÓN 1</h3><p>El porqué de la escuela</p><span class="status">PENDIENTE</span></div>
            <div class="mission-card" id="card-m2" onclick="location.href='m2.html'"><h3>MISIÓN 2</h3><p>Fase 1</p><span class="status">PENDIENTE</span></div>
            <div class="mission-card" id="card-m3" onclick="location.href='m3.html'"><h3>MISIÓN 3</h3><p>Fase 2</p><span class="status">PENDIENTE</span></div>
            <div class="mission-card" id="card-m4" onclick="location.href='m4.html'"><h3>MISIÓN 4</h3><p>Fase 3</p><span class="status">PENDIENTE</span></div>
        </div>

        <a href="m5.html" id="btn-mision-final" class="btn-final-mision hidden">ACCEDER AL COMPROMISO FINAL</a>
        
        <button onclick="reiniciarTablero()" style="width:100%; padding:15px; margin-top:20px; background:transparent; border:1px solid #444; color:#666; border-radius:8px;">REINICIAR TABLERO</button>
    </div>

    <script>
        // 1. Verificar estado de misiones 1 a 4
        const missions = ['m1', 'm2', 'm3', 'm4'];
        let todasCompletas = true;

        missions.forEach(m => {
            const card = document.getElementById('card-' + m);
            if(localStorage.getItem(m) === 'true') {
                card.classList.add('completed');
                card.querySelector('.status').innerText = 'COMPLETADO ✓';
            } else {
                todasCompletas = false; // Si falta una, cambiamos el estado
            }
        });

        // 2. Si todas son true, quitamos la clase .hidden para mostrar el botón
        if(todasCompletas) {
            document.getElementById('btn-mision-final').classList.remove('hidden');
        }

        function reiniciarTablero() { 
            if(confirm("¿Estás seguro de reiniciar todo el progreso?")) { 
                localStorage.clear(); 
                location.reload(); 
            } 
        }
    </script>
</body>
</html>
