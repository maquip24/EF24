<script>
    const missions = ['m1', 'm2', 'm3', 'm4'];
    
    missions.forEach(m => {
        const card = document.getElementById('card-' + m);
        const status = card.querySelector('.status');
        
        if(localStorage.getItem(m) === 'true') {
            card.classList.add('completed');
            status.innerHTML = 'COMPLETADO <span style="color:var(--neon-green)">✓</span>';
        }
    });

    if(missions.every(m => localStorage.getItem(m) === 'true')) {
        const btn = document.getElementById('final-btn');
        btn.disabled = false;
        btn.style.background = 'var(--neon-cyan)';
    }
</script>
