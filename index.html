<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GSM24 | Centro de Operaciones</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="mission-hub">
        <header>
            <img src="image_b5c380.jpg" class="hero-logo">
            <h1>CENTRO DE OPERACIONES GSM24</h1>
            <p>Escuela de Formación Carlos Quiroga</p>
        </header>

        <div class="grid-container">
            <button class="module" onclick="location.href='m1.html'" id="m1">01<br><span>EL PORQUÉ</span></button>
            <button class="module" onclick="location.href='m2.html'" id="m2">02<br><span>REENCONTRÉMONOS</span></button>
            <button class="module" onclick="location.href='m3.html'" id="m3">03<br><span>LO BÁSICO</span></button>
            <button class="module" onclick="location.href='m4.html'" id="m4">04<br><span>GOBERNANZA</span></button>
        </div>

        <button class="final-module" id="m5" onclick="location.href='m5.html'" disabled>
            05 | SEAL DE COMPROMISO
        </button>
    </div>

    <script>
        const checks = ['m1', 'm2', 'm3', 'm4'];
        checks.forEach(id => {
            if(localStorage.getItem(id)) document.getElementById(id).classList.add('active');
        });

        // Habilitar M5 solo si todos los anteriores están en localStorage
        if(checks.every(id => localStorage.getItem(id))) {
            document.getElementById('m5').disabled = false;
        }
    </script>
</body>
</html>
