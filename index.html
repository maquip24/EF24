<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>CENTRO DE MANDO GSM24</title>
    <style>
        :root { --bg: #050505; --neon-red: #ff3e3e; --neon-blue: #3e8bff; --neon-green: #3eff8b; --neon-yellow: #f3ff3e; --neon-cyan: #00f2ff; }
        body { background-color: var(--bg); color: white; font-family: sans-serif; margin: 0; display: flex; justify-content: center; min-height: 100vh; }
        .container { width: 90%; max-width: 600px; padding: 20px; text-align: center; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin: 30px 0; }
        .mission-card { height: 150px; border-radius: 20px; border: 2px solid #333; display: flex; flex-direction: column; justify-content: center; cursor: pointer; background: #111; transition: 0.3s; }
        .m1:hover { border-color: var(--neon-red); }
        .m2:hover { border-color: var(--neon-blue); }
        .m3:hover { border-color: var(--neon-green); }
        .m4:hover { border-color: var(--neon-yellow); }
        .completed { border-color: var(--neon-green) !important; background: #0a1a10 !important; }
        .final-gate { width: 100%; padding: 20px; background: #222; color: white; border: none; border-radius: 10px; cursor: pointer; }
        .final-gate:not(:disabled) { background: var(--neon-cyan); color: #000; }
    </style>
</head>
<body>
    <div class="container">
        <h1>CENTRO DE MANDO GSM24</h1>
        <div class="grid">
            <div class="mission-card m1" id="card-m1" onclick="location.href='m1.html'"><h3>MISIÓN 1</h3><span class="status">PENDIENTE</span></div>
            <div class="mission-card m2" id="card-m2" onclick="location.href='m2.html'"><h3>MISIÓN 2</h3><span class="status">PENDIENTE</span></div>
            <div class="mission-card m3" id="card-m3" onclick="location.href='m3.html'"><h3>MISIÓN 3</h3><span class="status">PENDIENTE</span></div>
            <div class="mission-card m4" id="card-m4" onclick="location.href='m4.html'"><h3>MISIÓN 4</h3><span class="status">PENDIENTE</span></div>
        </div>
        <button id="final-btn" class="final-gate" onclick="location.href='m5.html'" disabled>ACCEDER A M5</button>
        <button onclick="localStorage.clear(); location.reload();" style="margin-top:20px; background:transparent; border:none; color:#555;">REINICIAR</button>
    </div>
    <script>
        ['m1','m2','m3','m4'].forEach(m => {
            if(localStorage.getItem(m) === 'true') {
                const card = document.getElementById('card-' + m);
                card.classList.add('completed');
                card.querySelector('.status').innerText = 'COMPLETADO ✓';
            }
        });
        if(['m1','m2','m3','m4'].every(m => localStorage.getItem(m) === 'true')) document.getElementById('final-btn').disabled = false;
    </script>
</body>
</html>
