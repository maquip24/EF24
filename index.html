<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style.css">
    <style>
        .btn-ready { display: block; width: 90%; margin: 20px auto; padding: 20px; background: var(--neon-green); color: black; font-weight: bold; font-size: 1.2rem; border-radius: 15px; text-align: center; text-decoration: none; border: none; box-shadow: 0 0 15px var(--neon-green); }
        .hidden { display: none; }
    </style>
</head>
<body>
    <div class="container">
        <h1>CENTRO DE MANDO GSM24</h1>
        <a href="m5.html" id="btn-final" class="btn-ready hidden">ACCEDER AL COMPROMISO FINAL</a>
        
        <button onclick="reiniciarTablero()" style="margin-top:20px; background:transparent; color:#666;">REINICIAR TABLERO</button>
    </div>
    <script>
        const missions = ['m1', 'm2', 'm3', 'm4'];
        if(missions.every(m => localStorage.getItem(m) === 'true')) {
            document.getElementById('btn-final').classList.remove('hidden');
        }
    </script>
</body>
</html>
