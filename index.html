<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GSM24 | Centro de Operaciones</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>CENTRO DE MANDO GSM24</h1>
            <p>Escuela de Formación Carlos Quiroga</p>
        </header>

        <div class="grid">
            <div class="mission-card m1-theme" id="card-m1" onclick="location.href='m1.html'">
                <h3>MISIÓN 1</h3>
                <p>El Porqué</p>
                <span class="status">PENDIENTE</span>
            </div>
            <div class="mission-card m2-theme" id="card-m2" onclick="location.href='m2.html'">
                <h3>MISIÓN 2</h3>
                <p>Fase 1</p>
                <span class="status">PENDIENTE</span>
            </div>
            <div class="mission-card m3-theme" id="card-m3" onclick="location.href='m3.html'">
                <h3>MISIÓN 3</h3>
                <p>Fase 2</p>
                <span class="status">PENDIENTE</span>
            </div>
            <div class="mission-card m4-theme" id="card-m4" onclick="location.href='m4.html'">
                <h3>MISIÓN 4</h3>
                <p>Fase 3</p>
                <span class="status">PENDIENTE</span>
            </div>
        </div>

        <button id="final-btn" class="final-gate" onclick="location.href='m5.html'" disabled>
            ACCEDER AL COMPROMISO FINAL (M5)
        </button>

        <button onclick="reiniciarJuego()" class="reset-btn">
            REINICIAR TABLERO DE MISIONES
        </button>
    </div>

    <script>
        // Lógica: Verifica qué misiones están completadas
        const missions = ['m1', 'm2', 'm3', 'm4'];
        missions.forEach(m => {
            if(localStorage.getItem(m) === 'true') {
                const card = document.getElementById('card-' + m);
                card.classList.add('completed');
                card.querySelector('.status').innerHTML = 'COMPLETADO <span style="color:var(--neon-green)">✓</span>';
            }
        });

        // Habilitar M5 solo si todas las anteriores son 'true'
        if(missions.every(m => localStorage.getItem(m) === 'true')) {
            const btn = document.getElementById('final-btn');
            btn.disabled = false;
        }

        function reiniciarJuego() {
            if(confirm("¿Estás seguro de reiniciar todo el progreso?")) {
                localStorage.clear();
                window.location.reload();
            }
        }
    </script>
</body>
</html>
