<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Misión 04 | Gobernanza | GSM24</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .morse-container {
            background: #111; padding: 20px; border-radius: 15px;
            border: 1px solid #333; margin: 20px 0; text-align: center;
        }
        .signal-box {
            font-size: 2rem; color: var(--neon-yellow);
            letter-spacing: 10px; margin: 15px 0; min-height: 50px;
            word-wrap: break-word;
        }
        .restart-btn {
            margin: 15px auto; display: block;
            background: transparent; border: 1px solid #444; color: #666; 
            padding: 8px 15px; border-radius: 5px; cursor: pointer; font-size: 0.7rem;
        }
        .morse-btn {
            width: 140px; height: 140px; border-radius: 50%;
            background: #222; border: 4px solid var(--neon-yellow);
            color: var(--neon-yellow); font-weight: bold; cursor: pointer;
            transition: 0.1s; font-size: 1.2rem;
            -webkit-tap-highlight-color: transparent; /* Evita destello azul en móvil */
        }
        .morse-btn:active { background: var(--neon-yellow); color: #000; transform: scale(0.95); }
    </style>
</head>
<body>
    <div class="container">
        <div class="card m4-theme">
            <h2 style="color: var(--neon-yellow);">MISIÓN 04: GOBERNANZA</h2>
            
            <p style="font-size: 0.9rem; color: #aaa; margin-bottom: 20px;">
                La Gobernanza es el ritmo que sostiene nuestra estructura.<br>
                <b>Transmite la señal de mando correcta.</b>
            </p>

            <div class="morse-container">
                <div class="signal-box" id="display">_</div>
                <button onclick="reiniciarSenal()" class="restart-btn">REINICIAR SEÑAL</button>
                <button class="morse-btn" id="transmitter">TAP</button>
            </div>

            <p id="status" style="font-size: 0.8rem; color: #666;">Toca breve para punto, mantén para raya.</p>

            <button onclick="location.href='index.html'" style="width:100%; background:transparent; border:1px solid #444; color:#666; margin-top:20px; padding:15px; border-radius:10px; cursor:pointer;">
                REGRESAR AL CENTRO
            </button>
        </div>
    </div>

    <script>
        const display = document.getElementById('display');
        const transmitter = document.getElementById('transmitter');
        const status = document.getElementById('status');
        
        const targetSignal = ".--..---.."; 
        let signal = "";
        let startTime;
        let isProcessing = false; // Bloqueo para evitar doble entrada

        function start(e) {
            e.preventDefault();
            startTime = Date.now();
        }

        function end(e) {
            e.preventDefault();
            if (!startTime) return;
            
            const duration = Date.now() - startTime;
            startTime = null; // Reset

            // Filtrar toques fantasma (menos de 50ms)
            if (duration < 50) return;

            signal += (duration < 300) ? "." : "-";
            display.innerText = signal;

            // Validación
            if (signal === targetSignal) {
                localStorage.setItem('m4', 'true');
                status.innerText = "¡SEÑAL TRANSMITIDA!";
                status.style.color = "var(--neon-green)";
                alert("¡Señal de Gobernanza aceptada! Misión cumplida.");
                setTimeout(() => window.location.href = 'index.html', 500);
            } else if (signal.length >= targetSignal.length) {
                status.innerText = "Error: Secuencia incorrecta, reiniciando...";
                setTimeout(reiniciarSenal, 500);
            }
        }

        transmitter.addEventListener('mousedown', start);
        transmitter.addEventListener('mouseup', end);
        transmitter.addEventListener('touchstart', start, {passive: false});
        transmitter.addEventListener('touchend', end, {passive: false});

        function reiniciarSenal() {
            signal = "";
            display.innerText = "_";
            status.innerText = "Mantén presionado para raya, toque corto para punto.";
            status.style.color = "#666";
        }
    </script>
</body>
</html>
