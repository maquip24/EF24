<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Misión 04 | Gobernanza | GSM24</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .morse-container {
            background: #111; padding: 20px; border-radius: 15px;
            border: 1px solid #333; margin: 20px 0; text-align: center;
        }
        .signal-box {
            font-size: 2rem; color: var(--neon-yellow);
            letter-spacing: 10px; margin: 15px 0; min-height: 50px;
            word-wrap: break-word;
        }
        .morse-btn {
            width: 140px; height: 140px; border-radius: 50%;
            background: #222; border: 4px solid var(--neon-yellow);
            color: var(--neon-yellow); font-weight: bold; cursor: pointer;
            transition: 0.2s; font-size: 1.2rem;
        }
        .morse-btn:active { background: var(--neon-yellow); color: #000; transform: scale(0.95); }
    </style>
</head>
<body>
    <div class="container">
        <div class="card m4-theme">
            <h2 style="color: var(--neon-yellow);">MISIÓN 04: GOBERNANZA</h2>
            
            <p style="font-size: 0.9rem; color: #aaa; margin-bottom: 20px;">
                La Gobernanza es el ritmo que sostiene nuestra estructura.<br>
                <b>Transmite la señal de mando correcta.</b>
            </p>

            <div class="morse-container">
                <div class="signal-box" id="display">_</div>
                <button class="morse-btn" id="transmitter">TAP</button>
            </div>

            <p id="status" style="font-size: 0.8rem; color: #666;">Mantén presionado para raya, toque corto para punto.</p>

            <button onclick="location.href='index.html'" style="width:100%; background:transparent; border:1px solid #444; color:#666; margin-top:20px; padding:15px; border-radius:10px; cursor:pointer;">
                REGRESAR AL CENTRO
            </button>
        </div>
    </div>

    <script>
        const display = document.getElementById('display');
        const transmitter = document.getElementById('transmitter');
        const status = document.getElementById('status');
        
        // Señal objetivo: .--. .- --.. (PAZ)
        const targetSignal = ".--..---.."; 
        let signal = "";
        let startTime;

        transmitter.addEventListener('mousedown', () => startTime = Date.now());
        transmitter.addEventListener('touchstart', () => startTime = Date.now());

        transmitter.addEventListener('mouseup', endSignal);
        transmitter.addEventListener('touchend', endSignal);

        function endSignal() {
            const duration = Date.now() - startTime;
            signal += (duration < 300) ? "." : "-";
            display.innerText = signal;

            // Si la señal es correcta
            if (signal === targetSignal) {
                localStorage.setItem('m4', 'true');
                status.innerText = "¡SEÑAL TRANSMITIDA! GOBERNANZA CONFIRMADA.";
                status.style.color = "var(--neon-green)";
                alert("¡Señal de Gobernanza aceptada! Misión cumplida.");
                setTimeout(() => window.location.href = 'index.html', 1000);
            } 
            // Reset si el usuario se equivoca o llega al límite
            else if (signal.length >= targetSignal.length) {
                signal = "";
                display.innerText = "_";
                status.innerText = "Error: Intenta nuevamente.";
            }
        }
    </script>
</body>
</html>
