<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Misión 04 | Transmisor Morse | GSM24</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* Estilos específicos para el transmisor */
        .signal-display {
            background: #000;
            border: 1px solid var(--neon-yellow);
            height: 60px;
            margin: 20px 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            letter-spacing: 10px;
            color: var(--neon-yellow);
            border-radius: 10px;
        }

        .morse-btn {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: #222;
            border: 4px solid var(--neon-yellow);
            color: var(--neon-yellow);
            font-weight: bold;
            cursor: pointer;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            transition: transform 0.1s, box-shadow 0.1s;
        }

        .morse-btn:active {
            transform: scale(0.95);
            box-shadow: 0 0 20px var(--neon-yellow);
            background: #333;
        }

        .target-box {
            font-size: 0.9rem;
            color: #888;
            margin-bottom: 10px;
        }
    </style>
</head>

        </div>
    </div>
