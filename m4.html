<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Misión 04 | Gobernanza | GSM24</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .counter { font-size: 3rem; color: var(--neon-yellow); margin: 20px 0; }
        .morse-btn { width: 150px; height: 150px; border-radius: 50%; background: #222; border: 5px solid var(--neon-yellow); color: var(--neon-yellow); font-size: 1.5rem; cursor: pointer; }
    </style>
</head>
<body>
    <div class="container">
        <div class="card m4-theme">
            <h2>MISIÓN 04: GOBERNANZA</h2>
            <p>Emite 3 señales cortas para la letra <b>S</b> (...)</p>
            
            <div class="counter" id="display">0 / 3</div>
            
            <button class="morse-btn" id="transmitter" onclick="registrarClic()">TAP</button>
            
            <br><br>
            <button id="btnValidar" onclick="validarMision()" disabled>VALIDAR GOBERNANZA</button>
            <br>
            <a href="index.html" style="color:#555; display:block; margin-top:20px;">Volver al Centro de Mando</a>
        </div>
    </div>

    <script>
        let contador = 0;
        function registrarClic() {
            contador++;
            document.getElementById('display').innerText = contador + " / 3";
            
            if (contador === 3) {
                document.getElementById('display').innerText = "SEÑAL LISTA!";
                document.getElementById('display').style.color = "var(--neon-green)";
                document.getElementById('btnValidar').disabled = false;
            } else if (contador > 3) {
                contador = 0;
                document.getElementById('display').innerText = "0 / 3";
                document.getElementById('display').style.color = "var(--neon-yellow)";
            }
        }

        function validarMision() {
            localStorage.setItem('m4', 'true');
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
