<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Misión 04 | Morse | GSM24</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .signal-display { background: #000; border: 1px solid #f3ff3e; height: 60px; margin: 20px 0; display: flex; align-items: center; justify-content: center; font-size: 2rem; color: #f3ff3e; border-radius: 10px; }
        .morse-btn { width: 150px; height: 150px; border-radius: 50%; background: #222; border: 5px solid #f3ff3e; color: #f3ff3e; font-weight: bold; cursor: pointer; transition: 0.1s; }
        .morse-btn:active { background: #333; transform: scale(0.95); }
    </style>
</head>
<body>
    <div class="container">
        <div class="card m4-theme">
            <h2>MISIÓN 04: GOBERNANZA</h2>
            <p>Emite la señal <b>S</b> (...)</p>
            <div class="signal-display" id="display">...</div>
            <button class="morse-btn" id="transmitter">EMITIR</button>
            <p id="feedback" style="font-size:0.8rem; color:#888;">Presiona corto (.) o largo (-)</p>
            <button id="btnValidar" onclick="validarMision()" disabled>VALIDAR GOBERNANZA</button>
        </div>
    </div>

    <script>
        const display = document.getElementById('display');
        const btn = document.getElementById('btnValidar');
        let signalBuffer = "";
        let startTime;

        const start = (e) => { startTime = Date.now(); };
        const end = (e) => {
            const duration = Date.now() - startTime;
            // Aumentamos a 300ms para que sea más fácil en móvil
            signalBuffer += (duration < 300) ? "." : "-";
            if (signalBuffer.length > 3) signalBuffer = signalBuffer.slice(-3);
            display.innerText = signalBuffer;
            
            if (signalBuffer === "...") {
                display.style.color = "var(--neon-green)";
                btn.disabled = false;
            }
        };

        const t = document.getElementById('transmitter');
        t.addEventListener('mousedown', start);
        t.addEventListener('mouseup', end);
        t.addEventListener('touchstart', start);
        t.addEventListener('touchend', end);

        function validarMision() {
            localStorage.setItem('m4', 'true');
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
