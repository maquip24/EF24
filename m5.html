<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Misión 05 | Compromiso Final | GSM24</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        body { font-family: sans-serif; background: #000; color: #fff; margin: 0; padding: 15px; box-sizing: border-box; }
        .container { width: 100%; max-width: 600px; margin: 0 auto; }
        .step-card { display: none; }
        .active { display: block; }
        .card-content { background: #111; padding: 20px; border-radius: 15px; border: 1px solid #333; }
        .input-name { width: 100%; padding: 15px; margin: 10px 0; border-radius: 10px; border: 1px solid #444; box-sizing: border-box; font-size: 16px; background: #fff; color: #000; }
        .btn-confirm { width: 100%; padding: 18px; border-radius: 12px; border: none; cursor: pointer; font-weight: bold; font-size: 16px; margin-top: 15px; }
        h2, h3 { color: var(--neon-yellow, #f1c40f); }
        p { line-height: 1.5; font-size: 16px; color: #ddd; }
    </style>
</head>
<body>
    <div class="container">
        <div id="step1" class="step-card active">
            <div class="card-content" style="border: 2px solid #ff4444; background: rgba(255, 68, 68, 0.05);">
                <h3 style="color: #ff4444;">⚠️ ATENCIÓN</h3>
                <p>Es obligatorio ingresar al siguiente enlace en otro celular:</p>
                <p style="text-align: center; font-weight: bold; color: #fff;">www.scout.org.co</p>
                <button onclick="irA(2)" class="btn-confirm" style="background:#007bff; color:white;">Presiona acá cuando hayan leído el documento</button>
            </div>
        </div>

        <div id="step2" class="step-card">
            <div class="card-content">
                <h2>EL COMPROMISO</h2>
                <p>¿Te comprometes a cumplir esta misión permanente en tu vida scout?</p>
                <button onclick="irA(3)" class="btn-confirm" style="background:#28a745; color:white;">SÍ, ME COMPROMETO</button>
            </div>
        </div>

        <div id="step3" class="step-card">
            <div class="card-content">
                <h2>TU EQUIPO</h2>
                <input type="number" id="teamSize" placeholder="¿Cuántas personas integran tu equipo?" class="input-name">
                <button onclick="generarFormulario()" class="btn-confirm" style="background:#ffc107; color:black;">CONTINUAR</button>
            </div>
        </div>

        <div id="step4" class="step-card">
            <div class="card-content">
                <h2>FINALIZAR</h2>
                <p style="font-size: 0.9rem; color: #888; text-align: center;">Una vez descargado, envía el PDF al Jefe de Grupo por WhatsApp.</p>
                
                <button onclick="descargarPDF()" class="btn-confirm" style="background:#28a745; color:white;">DESCARGAR ACTA (PDF)</button>
                <button onclick="finalizarMision()" class="btn-confirm" style="background:#007bff; color:white;">FINALIZAR Y VOLVER</button>
            </div>
        </div>
    </div>

    <script>
        function irA(p) { 
            document.querySelectorAll('.step-card').forEach(s => s.classList.remove('active'));
            document.getElementById('step'+p).classList.add('active'); 
        }

        function generarFormulario() {
            const num = document.getElementById('teamSize').value;
            const contenedor = document.createElement('div');
            contenedor.id = "area-inputs";
            for (let i = 1; i <= num; i++) {
                contenedor.innerHTML += `<input type="text" class="nombre-input-real" placeholder="Nombre integrante ${i}" style="display:block; width:90%; padding:10px; margin:5px auto; border:1px solid #ccc; color:#000;">`;
            }
            document.getElementById('step3').appendChild(contenedor);
            irA(4);
        }

        function descargarPDF() {
            // Genera el PDF SOLO con el acta y los nombres, sin instrucciones extra
            let htmlContenido = `
                <div style="font-family: sans-serif; padding: 40px; color: #000; background: #fff;">
                    <h1 style="text-align:center; color: #000;">ACTA DE COMPROMISO GSM24</h1>
                    <p style="text-align:center; color: #000;">Escuela de Formación Carlos Quiroga</p>
                    <p style="line-height:1.6; color: #000;">
                        Como miembros de la Escuela de Formación Carlos Quiroga, sellamos este compromiso con nuestros nombres, 
                        prometiendo participar de los encuentros, talleres y cursos que me permitan avanzar en mi función como adulto voluntario.
                        <br><br>
                        <b>"Uno para Todos y Todos para Uno"</b>
                    </p>
                    <h3 style="color: #000;">Integrantes:</h3>
            `;
            
            const inputs = document.querySelectorAll('.nombre-input-real');
            inputs.forEach(input => {
                const nombre = input.value || "__________________________";
                htmlContenido += `<p style="margin: 10px 0; border-bottom: 1px solid #000; padding: 5px; color: #000;">${nombre}</p>`;
            });
            
            htmlContenido += `</div>`;

            const opt = { margin: 15, filename: 'Acta_Compromiso_GSM24.pdf', html2canvas: { scale: 2 }, jsPDF: { unit: 'mm', format: 'a4' } };
            html2pdf().set(opt).from(htmlContenido).save();
        }

        function finalizarMision() { localStorage.setItem('m5', 'true'); window.location.href = 'index.html'; }
    </script>
</body>
</html>
