<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        .step-card { display:none; } .active { display:block; }
        .input-name { width:100%; padding:12px; margin:10px 0; border-radius:8px; border:1px solid #444; }
        .btn-confirm { width:100%; padding:15px; border-radius:10px; border:none; cursor:pointer; font-weight:bold; }
    </style>
</head>
<body style="background:#000; color:#fff; padding:20px;">
    <div id="step1" class="step-card active">
        <div style="border:3px solid #ff4444; padding:20px; border-radius:15px;"><h3>⚠️ ATENCIÓN</h3><p>Obligatorio leer lineamientos.</p><button onclick="window.open('http://www.scout.org.co', '_blank'); irA(2);" class="btn-confirm">LEER DOCUMENTO</button></div>
    </div>
    <div id="step2" class="step-card">
        <h2>EL COMPROMISO</h2><p>¿Te comprometes a cumplir esta misión en tu vida scout?</p><button onclick="irA(3)" class="btn-confirm" style="background:#28a745;">SÍ, ME COMPROMETO</button>
    </div>
    <div id="step3" class="step-card">
        <h2>TU EQUIPO</h2><input type="number" id="teamSize" placeholder="Cantidad" class="input-name"><button onclick="generarFormulario()" class="btn-confirm" style="background:#ffc107;">CONTINUAR</button>
    </div>
    <div id="step4" class="step-card">
        <div id="pdf-view" style="padding:20px; background:white; color:black;">
            <div style="text-align:center;"><img src="https://drive.google.com/uc?id=1gszq7EM3VUPrlGRpvUBjEIJ5GGNeXBKM" style="max-width:150px;"></div>
            <h1>ACTA DE COMPROMISO GSM24</h1>
            <p>Como miembros de la Escuela de Formación Carlos Quiroga, sellamos este compromiso...</p>
            <div id="lista-nombres-pdf"></div>
        </div>
        <button onclick="descargarPDF()" class="btn-confirm" style="background:#28a745; margin-bottom:10px;">DESCARGAR PDF</button>
        <button onclick="finalizarMision()" class="btn-confirm" style="background:#007bff;">FINALIZAR</button>
    </div>
    <script>
        function irA(p) { document.querySelectorAll('.step-card').forEach(s => s.classList.remove('active')); document.getElementById('step'+p).classList.add('active'); }
        function generarFormulario() {
            const num = document.getElementById('teamSize').value;
            const cont = document.getElementById('lista-nombres-pdf');
            cont.innerHTML = "<h3>Integrantes:</h3>";
            for (let i = 1; i <= num; i++) cont.innerHTML += `<input type="text" class="input-name" oninput="this.setAttribute('value', this.value);">`;
            irA(4);
        }
        function descargarPDF() {
            const el = document.getElementById('pdf-view').cloneNode(true);
            el.querySelectorAll('input').forEach(i => { const p = document.createElement('p'); p.innerText = i.getAttribute('value') || "________________"; i.parentNode.replaceChild(p, i); });
            html2pdf().from(el).save('Acta_Compromiso.pdf');
        }
        function finalizarMision() { localStorage.setItem('m5', 'true'); window.location.href = 'index.html'; }
    </script>
</body>
</html>
