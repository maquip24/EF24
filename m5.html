<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Misión 05 | El Compromiso | GSM24</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/signature_pad@4.0.0/dist/signature_pad.umd.min.js"></script>
    <style>
        #signature-pad { background: white; border-radius: 10px; width: 100%; height: 200px; touch-action: none; }
        .upload-area { margin: 20px 0; border: 2px dashed #555; padding: 20px; border-radius: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="card m5-theme">
            <h2>MISIÓN 05: EL COMPROMISO</h2>
            
            <div class="upload-area">
                <p>1. Sube tu fotografía de perfil:</p>
                <input type="file" id="fotoInput" accept="image/*">
            </div>

            <p>2. Firma tu compromiso:</p>
            <canvas id="signature-pad"></canvas>
            <button onclick="signaturePad.clear()" style="background:#444; font-size:0.7rem;">Limpiar Firma</button>

            <br><br>
            <button class="final-gate" onclick="generarPDF()">DESCARGAR COMPROMISO PDF</button>
            <br>
            <button onclick="location.href='index.html'" style="background:transparent; border:none; color:#555;">Volver al Centro</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('signature-pad');
        const signaturePad = new SignaturePad(canvas);

        function generarPDF() {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            
            doc.setFontSize(20);
            doc.text("Compromiso Escuela Carlos Quiroga 2026", 20, 20);
            doc.setFontSize(12);
            doc.text("Yo, Scout del GSM24, me comprometo a fortalecer la gobernanza, \nla sostenibilidad y la cultura de equipo.", 20, 40);

            // Añadir firma
            const signatureData = signaturePad.toDataURL('image/png');
            doc.addImage(signatureData, 'PNG', 20, 60, 100, 50);

            doc.save("Compromiso_Scout_GSM24.pdf");
            alert("¡Compromiso sellado! Documento descargado.");
            localStorage.setItem('m5', 'true');
        }
    </script>
</body>
</html>
