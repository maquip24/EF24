<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Misión 03 | Rastreo | GSM24</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .canvas-container {
            position: relative;
            width: 300px;
            height: 300px;
            margin: 20px auto;
            border: 4px solid #333;
            border-radius: 15px;
            /* Fondo donde está escrito BADEN POWELL */
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #pista-canvas {
            position: absolute;
            top: 0;
            left: 0;
            z-index: 2;
            cursor: crosshair;
            touch-action: none;
        }
        #codigo-oculto {
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--neon-green);
            letter-spacing: 2px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card m3-theme">
            <h2 style="color: var(--neon-green);">MISIÓN 03: RASTREO</h2>
            
            <p>Limpia la niebla para revelar el nombre del fundador.</p>

            <div class="canvas-container">
                <div id="codigo-oculto">BADEN POWELL</div>
                <canvas id="pista-canvas" width="300" height="300"></canvas>
            </div>

            <div id="input-area" style="display:none;">
                <input type="text" id="respuesta" placeholder="Escribe el nombre revelado..." style="text-transform: uppercase;">
                <button onclick="validarRespuesta()" style="background: var(--neon-green); color: black;">VALIDAR RASTREO</button>
            </div>

            <button onclick="location.href='index.html'" style="background:transparent; border:1px solid #444; color:#666; margin-top:15px;">REGRESAR AL CENTRO</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('pista-canvas');
        const ctx = canvas.getContext('2d');
        
        // Dibujar la niebla (capa superior)
        ctx.fillStyle = '#333';
        ctx.fillRect(0, 0, 300, 300);
        ctx.fillStyle = '#666';
        ctx.textAlign = 'center';
        ctx.fillText("DESLIZA AQUÍ", 150, 150);

        let pixelsLimpiados = 0;
        const totalThreshold = 2000; // Sensibilidad de limpieza

        function limpiar(e) {
            const rect = canvas.getBoundingClientRect();
            const x = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left;
            const y = (e.touches ? e.touches[0].clientY : e.clientY) - rect.top;
            
            ctx.clearRect(x - 25, y - 25, 50, 50);
            
            pixelsLimpiados++;
            if (pixelsLimpiados > totalThreshold) {
                document.getElementById('input-area').style.display = 'block';
            }
        }

        canvas.addEventListener('mousemove', limpiar);
        canvas.addEventListener('touchmove', limpiar);

        function validarRespuesta() {
            const resp = document.getElementById('respuesta').value.toUpperCase();
            if(resp === "BADEN POWELL") {
                localStorage.setItem('m3', 'true');
                alert("¡Rastreo exitoso, Scout!");
                window.location.href = 'index.html';
            } else {
                alert("Nombre incorrecto. ¡Sigue limpiando y observa bien!");
            }
        }
    </script>
</body>
</html>
