<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Momento 1: El Origen | GSM24</title>
    <style>
        :root { --neon: #64ffda; --dark: #0a192f; }
        body { background: var(--dark); color: #fff; font-family: 'Segoe UI', sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
        .card { background: rgba(255,255,255,0.05); padding: 2rem; border-radius: 20px; border: 1px solid var(--neon); width: 85%; max-width: 400px; text-align: center; }
        input { background: transparent; border: 1px solid var(--neon); color: var(--neon); padding: 10px; width: 80%; border-radius: 5px; font-size: 1.2rem; text-align: center; }
        button { background: var(--neon); color: var(--dark); border: none; padding: 15px 30px; border-radius: 10px; font-weight: bold; margin-top: 20px; cursor: pointer; }
    </style>
</head>
<body>

<div class="card">
    <img src="image_b5c380.jpg" style="width:100%; border-radius:10px; margin-bottom:15px;">
    <h2>El Porqué de la Escuela</h2>
    <p>Descifra la clave Baden-Powell para revelar el propósito fundamental:</p>
    
    <input type="text" id="claveInput" placeholder="Ingresa el código...">
    <br>
    <button onclick="verificarClave()">Desbloquear Misión</button>
</div>

<script>
function verificarClave() {
    const input = document.getElementById('claveInput').value.toLowerCase();
    // La clave es "servir" (ejemplo)
    if(input === "servir") {
        alert("¡Correcto! El propósito es el Servicio.");
        window.location.href = 'momento2.html';
    } else {
        alert("Clave incorrecta, Scout. Reintenta.");
    }
}
</script>
</body>
</html>
