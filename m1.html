<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Misión 01</title>
    <style>
        body { background: #050505; color: white; display: flex; justify-content: center; align-items: center; min-height: 100vh; font-family: sans-serif; }
        .card { border: 2px solid #ff3e3e; padding: 40px; border-radius: 20px; text-align: center; background: #111; }
        input { padding: 15px; border-radius: 10px; border: 1px solid #ff3e3e; background: #000; color: white; text-align: center; }
        button { padding: 15px 30px; background: #ff3e3e; border: none; color: white; border-radius: 10px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="card">
        <h2>MISIÓN 01</h2>
        <p>Ingresa la palabra clave:</p>
        <input type="text" id="clave">
        <br><br>
        <button onclick="validar()">VALIDAR</button>
        <br><br>
        <a href="index.html" style="color:#555">Volver</a>
    </div>
    <script>
        function validar() {
            if(document.getElementById('clave').value.toLowerCase() === "servicio") {
                localStorage.setItem('m1', 'true');
                window.location.href = 'index.html';
            } else {
                alert("Incorrecto");
            }
        }
    </script>
</body>
</html>
