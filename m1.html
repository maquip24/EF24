<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Misión 01 | El Porqué | GSM24</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* Ajustes específicos para móviles */
        body { margin: 0; padding: 20px; font-size: 16px; }
        .container { width: 100%; max-width: 600px; margin: 0 auto; box-sizing: border-box; }
        .card { 
            background: #111; padding: 25px; border-radius: 20px; 
            border: 1px solid #333; text-align: center;
        }
        h2 { font-size: 1.5rem; margin-bottom: 20px; color: var(--neon-yellow); }
        p { font-size: 1.1rem; line-height: 1.6; color: #ddd; margin-bottom: 25px; }
        
        .btn-action { 
            width: 100%; padding: 18px; border-radius: 12px; border: none; 
            font-size: 1.1rem; font-weight: bold; cursor: pointer; margin-bottom: 15px;
        }
        .btn-complete { background: var(--neon-green); color: black; }
        .btn-back { background: transparent; border: 1px solid #444; color: #666; }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <h2>MISIÓN 01: EL PORQUÉ</h2>
            <p>
                Entender el propósito de nuestra Escuela Carlos Quiroga es el primer paso. 
                Aquí formamos líderes que trascienden. ¿Estás listo para iniciar este rastro?
            </p>

            <button class="btn-action btn-complete" onclick="completarMision()">MARCAR COMO COMPLETADA</button>
            <button class="btn-action btn-back" onclick="location.href='index.html'">REGRESAR</button>
        </div>
    </div>

    <script>
        function completarMision() {
            localStorage.setItem('m1', 'true');
            alert("¡Misión 1 completada!");
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
