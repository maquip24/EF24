<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Misión 01 | El Porqué | GSM24</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="card m1-theme">
            <h2 style="font-size: 2rem; color: var(--neon-red);">MISIÓN 01</h2>
            <p>La esencia Mosquetera se basa en el legado de Carlos Quiroga.</p>
            <p style="font-style: italic; color: #888;">"¿Cuál es el propósito fundamental?"</p>
            
            <input type="text" id="clave" placeholder="Ingresa la palabra clave...">
            
            <button onclick="validarMision()" class="action-btn">EJECUTAR PROTOCOLO</button>
            <button onclick="location.href='index.html'" style="background:transparent; border:none; color:#555; margin-top:15px;">Volver al Centro de Mando</button>
        </div>
    </div>

    <script>
        function validarMision() {
            const respuesta = document.getElementById('clave').value.toLowerCase();
            // Validamos contra la palabra "servicio"
            if(respuesta === "servicio") {
                localStorage.setItem('m1', 'true');
                const btn = document.querySelector('.action-btn');
                btn.innerText = "PROCESANDO...";
                btn.style.background = "var(--neon-green)";
                
                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 800);
            } else {
                alert("Acceso denegado. Código no reconocido.");
            }
        }
    </script>
</body>
</html>
