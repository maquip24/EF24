<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style.css">
    <title>Misión 01 | Inmersiva</title>
</head>
<body>
    <div class="container">
        <div class="card m1-theme">
            <h2 style="font-size: 2rem; color: var(--neon-red);">MISIÓN 01</h2>
            <p>La esencia Mosquetera se basa en el legado de Carlos Quiroga.</p>
            <p style="font-style: italic; color: #888;">"¿Cuál es el propósito fundamental?"</p>
            
            <input type="text" id="clave" placeholder="Ingresa la palabra clave...">
            
            <button onclick="validarMision()" class="action-btn">EJECUTAR PROTOCOLO</button>
            <button onclick="location.href='index.html'" style="background:transparent; border:none; color:#555;">Volver al Centro de Mando</button>
        </div>
    </div>

    <script>
        function validarMision() {
            // Ajusta la clave según el documento de la Escuela
            if(document.getElementById('clave').value.toLowerCase() === "servicio") {
                localStorage.setItem('m1', 'true');
                // Efecto de carga
                document.querySelector('.action-btn').innerText = "PROCESANDO...";
                setTimeout(() => window.location.href = 'index.html', 800);
            } else {
                alert("Acceso denegado. Intenta de nuevo.");
            }
        }
    </script>
</body>
</html>
