<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Misión 01 | GSM24</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="card m1-theme">
            <h2>MISIÓN 01: EL PORQUÉ</h2>
            <p>Ingresa la palabra clave del legado:</p>
            <input type="text" id="clave" placeholder="Palabra clave...">
            <button onclick="validarMision()">VALIDAR MISIÓN</button>
        </div>
    </div>

    <script>
// En tu m1.html, dentro de la función validarMision:
function validarMision() {
    const respuesta = document.getElementById('clave').value.toLowerCase();
    if(respuesta === "servicio") {
        localStorage.setItem('m1', 'true');
        alert("¡Misión M1 guardada! Redirigiendo...");
        window.location.href = 'index.html'; 
    } else {
        alert("Clave incorrecta");
    }
}
    </script>
</body>
</html>
