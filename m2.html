<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Misión 02 | Navegación Scout | GSM24</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .compass-container {
            position: relative; width: 180px; height: 180px; margin: 20px auto;
            border: 6px solid #222; border-radius: 50%;
            display: flex; justify-content: center; align-items: center;
            background: radial-gradient(circle, #1a1a1a 0%, #000 100%);
        }
        #aguja {
            width: 10px; height: 140px;
            background: linear-gradient(to bottom, var(--neon-red) 50%, #fff 50%);
            clip-path: polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%);
            transition: transform 0.05s ease-out;
        }
        .rumbo-card { 
            background: #151515; padding: 15px; border-radius: 12px; margin: 10px 0; 
            border: 1px solid #333; display: flex; justify-content: space-between; align-items: center; 
        }
        .grados-val { font-size: 1.2rem; font-weight: bold; color: var(--neon-blue); }
        .check-btn { padding: 10px 20px; border-radius: 8px; background: #222; border: 2px solid #555; color: #555; cursor: pointer; font-weight: bold; }
        .check-btn.active { background: var(--neon-green); color: #000; border: none; }
        .hidden { display: none; }
        p { margin: 10px 0; color: #ccc; }
    </style>
</head>
<body>
    <div class="container">
        <div class="card m2-theme">
            <h2 style="color: var(--neon-blue);">MISIÓN 02: NAVEGACIÓN</h2>

            <div class="compass-container">
                <div id="aguja"></div>
            </div>
            <div id="display-grados" style="font-size: 2rem; color: var(--neon-blue); font-weight: bold; margin-bottom: 10px;">0°</div>

            <p style="font-style: italic; color: var(--neon-blue);">Para iniciar el rumbo al patrono debes mirar.</p>
            <p>Utiliza la brújula para seguir los rumbos y marca cada paso.</p>

            <div id="lista-rumbos" style="margin: 20px 0;"></div>

            <div id="seccion-clave" class="hidden">
                <input type="text" id="clave-final" placeholder="Introduce la clave final...">
                <button onclick="validarMision()" style="background: var(--neon-blue); color: black;">FINALIZAR MISIÓN</button>
            </div>

            <button onclick="location.href='index.html'" style="background:transparent; border:1px solid #444; color:#666; margin-top:20px; width:100%; padding:10px;">REGRESAR AL CENTRO</button>
        </div>
    </div>

    <script>
        const aguja = document.getElementById('aguja');
        const displayGrados = document.getElementById('display-grados');
        const rumbos = [145, 75, 300, 215, 23];
        let completados = 0;

        // Lógica Brújula (Solicita permiso para sensores en iOS/Android)
        window.addEventListener("deviceorientation", (event) => {
            let alpha = event.alpha;
            if (alpha !== null) {
                aguja.style.transform = `rotate(${-alpha}deg)`;
                displayGrados.innerText = Math.round(alpha) + "°";
            }
        });

        // Lógica Lista
        const container = document.getElementById('lista-rumbos');
        rumbos.forEach((g, index) => {
            container.innerHTML += `
                <div class="rumbo-card">
                    <span class="grados-val">Rumbo: ${g}°</span>
                    <button class="check-btn" onclick="marcar(this, ${index})" id="btn-${index}">✓</button>
                </div>`;
        });

        function marcar(btn, index) {
            if(!btn.classList.contains('active')) {
                btn.classList.add('active');
                completados++;
            }
            if (completados === rumbos.length) {
                document.getElementById('seccion-clave').classList.remove('hidden');
            }
        }

        function validarMision() {
            const clave = document.getElementById('clave-final').value.toLowerCase();
            if(clave === "norte") {
                localStorage.setItem('m2', 'true');
                alert("¡Navegación completada con éxito!");
                window.location.href = 'index.html';
            } else {
                alert("Clave incorrecta. Sigue buscando.");
            }
        }
    </script>
</body>
</html>
