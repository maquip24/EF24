<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Misión 02 | Navegación Scout | GSM24</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .rumbo-card { background: #1a1a1a; padding: 20px; border-radius: 15px; margin: 15px 0; border: 1px solid #333; display: flex; justify-content: space-between; align-items: center; }
        .grados-val { font-size: 1.8rem; font-weight: bold; color: var(--neon-blue); }
        .check-btn { padding: 15px 25px; border-radius: 10px; background: #222; border: 2px solid #555; color: #555; cursor: pointer; }
        .check-btn.active { background: var(--neon-green); color: #000; border: none; }
        .hidden { display: none; }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <h2>MISIÓN 02: NAVEGACIÓN</h2>
            <p>Sigue la ruta de grados. Completa cada punto para desbloquear la clave final.</p>

            <div id="lista-rumbos">
                </div>

            <div id="seccion-clave" class="hidden">
                <input type="text" id="clave-final" placeholder="Introduce la clave final...">
                <button onclick="validarMision()" class="btn-validate">FINALIZAR MISIÓN</button>
            </div>
        </div>
    </div>

    <script>
        const rumbos = [145, 75, 300, 215, 23];
        let completados = 0;

        function renderizarRumbos() {
            const container = document.getElementById('lista-rumbos');
            rumbos.forEach((g, index) => {
                container.innerHTML += `
                    <div class="rumbo-card" id="card-${index}">
                        <span class="grados-val">${g}°</span>
                        <button class="check-btn" onclick="marcar(${index})" id="btn-${index}">✓</button>
                    </div>`;
            });
        }

        function marcar(index) {
            document.getElementById(`btn-${index}`).classList.add('active');
            completados++;
            if (completados === rumbos.length) {
                document.getElementById('seccion-clave').classList.remove('hidden');
            }
        }

        function validarMision() {
            const clave = document.getElementById('clave-final').value.toLowerCase();
            if(clave === "orientacion") { // Define aquí tu clave
                localStorage.setItem('m2', 'true');
                alert("¡Navegación completada con éxito!");
                window.location.href = 'index.html';
            } else {
                alert("Clave incorrecta. Sigue buscando.");
            }
        }

        renderizarRumbos();
    </script>
</body>
</html>
